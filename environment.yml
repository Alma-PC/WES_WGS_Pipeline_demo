# Main environment: every tool except Ensembl VEP.
# VEP lives in workflow/envs/vep.yml because bioconda's ensembl-vep pulls
# perl-bio-samtools, which pins samtools 0.1.x and conflicts with modern samtools.
# Snakemake builds that environment automatically when run with --use-conda.
name: wes-demo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal=9.27.2
  - curl=8.23.0
  - fastqc=0.13.0
  - fastp=1.4.0
  - multiqc=1.35
  - bwa-mem2=2.3
  - samtools=1.25
  - htslib=1.25
  - bcftools=1.25
  - gatk4=4.6.2.0
  - openjdk=17
  - pandas=3.1.1
  - jupyterlab=4.6.6
  - nbconvert=7.17.2
